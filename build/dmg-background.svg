<svg xmlns="http://www.w3.org/2000/svg" width="540" height="380" viewBox="0 0 540 380">
  <!-- DMG window background, in the brand (brand/BrandPalette + BrandType): the Paper → Amber tint
       gradient for large brand surfaces, the wordmark in Space Grotesk, a Signal-blue arrow,
       instructions in Inter (Graphite / Slate). Icons are placed by package.json build.dmg.contents
       at (140,160) and (400,160). Rasterized by `npm run assets` (scripts/make-assets.js), which
       fills the style element below with the bundled brand fonts (an SVG image can't load them). -->
  <style>/* brand fonts: injected by scripts/make-assets.js */</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9F4"/>
      <stop offset="1" stop-color="#F5E3BE"/>
    </linearGradient>
  </defs>
  <rect width="540" height="380" fill="url(#bg)"/>

  <!-- the wordmark: "Markdown" Bold Graphite, "Helper" Regular Slate, tracking −2% -->
  <text x="270" y="66" text-anchor="middle" font-family="'Space Grotesk', 'Helvetica Neue', sans-serif" font-size="26" letter-spacing="-0.52" fill="#1B1F24"><tspan font-weight="700">Markdown</tspan> <tspan font-weight="400" fill="#5B6470">Helper</tspan></text>

  <!-- arrow from the app to the Applications folder -->
  <path d="M 218 160 C 250 140, 290 140, 322 160" fill="none" stroke="#3D5AFE" stroke-width="4" stroke-linecap="round"/>
  <path d="M 312 148 L 326 163 L 307 168" fill="none" stroke="#3D5AFE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">
    <text x="270" y="290" font-size="15" font-weight="600" fill="#1B1F24">Drag Markdown Helper to Applications to install</text>
    <text x="270" y="318" font-size="12" fill="#5B6470">No admin rights? Drag it into the Applications folder</text>
    <text x="270" y="336" font-size="12" fill="#5B6470">inside your Home folder (~/Applications) instead.</text>
  </g>
</svg>
