<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Markdown Helper app icon: brand/BrandIcon.dc.html ("Brand 01 — App icon": ".md" on an
       amber highlight with a five-arm asterisk; 64-unit grid, same artwork at every size). Placed on the macOS icon grid: 824px
       tile centered on a 1024 canvas (1 unit = 12.875px).
       The ".md" is JetBrains Mono Bold 21/64 converted to outlines, so no font is needed to
       render it. Regenerate build/icon.png + icon.icns with: npm run assets -->
  <defs>
    <!-- In the tile's 64-unit space: 12px down, 14px blur -->
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-8" y="-8" width="80" height="80">
      <feDropShadow dx="0" dy="0.93" stdDeviation="1.09" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <!-- G3: Paper → Amber tint, 135° -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9F4"/>
      <stop offset="1" stop-color="#F5E3BE"/>
    </linearGradient>
  </defs>
  <g transform="translate(100 100) scale(12.875)">
