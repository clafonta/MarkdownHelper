<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;"
  />
  <title>Markdown Helper</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="boot.js"></script>
</head>
<body>
  <header class="app-header">
    <!-- The brand lockup: icon (brand/BrandIcon.dc.html; colors from CSS so dark mode gets the
         dark variant) + wordmark. -->
    <h1 class="app-title">
      <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="brand-tile" x1="0" y1="0" x2="1" y2="1">
            <stop class="tile-a" offset="0" /><stop class="tile-b" offset="1" />
          </linearGradient>
        </defs>
        <rect class="tile" x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="url(#brand-tile)" />
        <path d="M7 31.5L51 28.5V54.5L7 56.5Z" fill="#F59F00" />
        <text x="29" y="50.5" text-anchor="middle" font-size="21" font-family="JetBrains Mono, monospace" font-weight="700" fill="#1B1F24">.md</text>
        <path class="mark" d="M49 16L49.00 10.20M49 16L54.52 14.21M49 16L52.41 20.69M49 16L45.59 20.69M49 16L43.48 14.21" fill="none" stroke-width="2.4" stroke-linecap="round" />
      </svg>
      <span>Markdown <span class="wordmark-sub">Helper</span></span>
    </h1>
    <div class="doc-info" aria-live="polite">
      <span id="doc-name" class="doc-name">Untitled</span>
      <span id="doc-dirty" class="doc-dirty" hidden>Edited</span>
    </div>
    <div class="header-actions">
      <!-- View: Markdown only / both panes / Preview only (renderer.js "View mode").
           Icons: Lucide (code, columns-2, eye), ISC license, see LICENSE-lucide.txt. -->
      <div id="view-switch" class="view-switch" role="group" aria-label="View">
        <button class="view-btn" type="button" data-view="editor" aria-pressed="false" title="Markdown only (⌘1)" aria-label="Markdown only">
          <svg class="view-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6" /><path d="m8 6-6 6 6 6" /></svg>
        </button>
        <button class="view-btn" type="button" data-view="split" aria-pressed="true" title="Markdown and Preview (⌘2)" aria-label="Markdown and Preview">
          <svg class="view-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M12 3v18" /></svg>
        </button>
        <button class="view-btn" type="button" data-view="preview" aria-pressed="false" title="Preview only (⌘3)" aria-label="Preview only">
          <svg class="view-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></svg>
        </button>
      </div>
    <button id="theme-toggle" class="toggle theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="toggle-label">Dark mode</span>
      <span class="switch" aria-hidden="true"><span class="switch-thumb"></span></span>
    </button>
    </div>
  </header>

  <!-- Unsaved text recovered from an earlier session (renderer.js showRecoveryBar). -->
  <div id="recovery-bar" class="recovery-bar" role="region" aria-label="Recovered text" hidden></div>

  <main class="workspace">
    <aside id="sidebar" class="sidebar" aria-label="Folder files" hidden>
      <div class="pane-header">
        <span id="folder-name" class="pane-title folder-name">Files</span>
        <div class="sidebar-actions">
          <button id="btn-refresh-folder" class="icon-btn" type="button" title="Refresh file list" aria-label="Refresh file list">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M12 1.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-close-folder" class="icon-btn" type="button" title="Close folder" aria-label="Close folder">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <nav id="file-tree" class="file-tree" aria-label="Markdown and text files"></nav>
    </aside>

    <div class="panes">
      <section id="pane-editor" class="pane pane-editor" aria-label="Markdown source">
        <div class="pane-header">
          <span id="editor-title" class="pane-title">Markdown</span>
          <div class="toolbar" role="toolbar" aria-label="Editing tools">
            <!-- Opens the native Edit menu, same as right-click in the editor (formatMenuTemplate in main.js) -->
            <button id="btn-format" class="tool-btn menu-btn" type="button" aria-haspopup="menu"
              aria-label="Edit: formatting and text tools"
              title="Formatting and text tools (also on right-click). Text tools apply to the selection, or to the whole document if nothing is selected">
              Edit<span class="menu-caret" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <!-- Find & Replace (Cmd+F / Option+Cmd+F); renderer.js "Find & Replace" -->
        <div id="find-bar" class="find-bar" role="search" aria-label="Find in document" hidden>
          <div class="find-row">
            <button id="find-toggle-replace" class="find-btn" type="button" aria-expanded="false" title="Show Replace (⌥⌘F)" aria-label="Show Replace">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <input id="find-input" class="find-input" type="text" placeholder="Find" aria-label="Find" spellcheck="false" autocomplete="off" />
            <span id="find-count" class="find-count" aria-live="polite"></span>
            <button id="find-case" class="find-btn find-opt" type="button" aria-pressed="false" title="Match Case">Aa</button>
            <button id="find-word" class="find-btn find-opt" type="button" aria-pressed="false" title="Whole Words"><u>ab</u></button>
            <button id="find-prev" class="find-btn" type="button" title="Previous (⇧⌘G or ⇧Enter)" aria-label="Previous match">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 7.5L6 4l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="find-next" class="find-btn" type="button" title="Next (⌘G or Enter)" aria-label="Next match">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="find-close" class="find-btn" type="button" title="Close (Esc)" aria-label="Close find">×</button>
          </div>
          <div id="replace-row" class="find-row" hidden>
            <input id="replace-input" class="find-input" type="text" placeholder="Replace" aria-label="Replace with" spellcheck="false" autocomplete="off" />
            <button id="replace-one" class="tool-btn find-action" type="button" title="Replace this match and go to the next">Replace</button>
            <button id="replace-all" class="tool-btn find-action" type="button" title="Replace every match">Replace All</button>
          </div>
        </div>
        <textarea id="editor" class="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </section>

      <div id="divider" class="divider" role="separator" tabindex="0"
        aria-orientation="vertical" aria-label="Resize panes" aria-controls="pane-editor"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"
        title="Drag to resize · double-click to reset"></div>

      <section class="pane pane-preview" aria-label="Formatted preview">
        <div class="pane-header">
          <span id="preview-title" class="pane-title">Preview</span>
          <div class="pane-actions">
            <span id="stats" class="pane-meta"></span>
            <button id="sync-toggle" class="toggle toggle-sm" type="button" role="switch" aria-checked="true"
              title="Keep the editor and preview scrolled to the same place">
              <span class="toggle-label">Sync scroll</span>
              <span class="switch" aria-hidden="true"><span class="switch-thumb"></span></span>
            </button>
            <button id="btn-copy" class="tool-btn" type="button"
              title="Copy the formatted preview, ready to paste into an email or document (⇧⌘C)">
              Copy
            </button>
          </div>
        </div>
        <article id="preview" class="preview markdown-body"></article>
        <!-- .html documents: rendered like a browser would, but sandboxed (no scripts, forms or popups). -->
        <iframe id="preview-frame" class="preview-frame" sandbox="allow-same-origin" title="HTML preview" hidden></iframe>
        <div id="preview-none" class="preview-none" hidden></div>
      </section>
    </div>
  </main>

  <!-- A Mermaid diagram, full size: click one in the preview. Zoom with pinch / ⌘-scroll / the
       buttons, drag to pan, Escape closes (renderer.js "Diagram zoom", math in zoom-view.js). -->
  <div id="diagram-zoom" class="diagram-zoom" role="dialog" aria-label="Diagram" tabindex="-1" hidden>
    <div class="diagram-zoom-bar">
      <button type="button" class="tool-btn" data-zoom="out" title="Zoom out (−)" aria-label="Zoom out">−</button>
      <span class="diagram-zoom-level" aria-live="polite">100%</span>
      <button type="button" class="tool-btn" data-zoom="in" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button type="button" class="tool-btn" data-zoom="fit" title="Fit to window (0)">Fit</button>
      <button type="button" class="tool-btn" data-zoom="actual" title="Actual size (1)">100%</button>
      <button type="button" class="tool-btn diagram-zoom-close" data-zoom="close" title="Close (Esc)" aria-label="Close">✕</button>
    </div>
    <div class="diagram-zoom-viewport"><img class="diagram-zoom-img" alt="Diagram" draggable="false" /></div>
  </div>

  <script src="../../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="../file-types.js"></script>
  <script src="../text-format.js"></script>
  <script src="data-preview.js"></script>
  <script src="tools.js"></script>
  <script src="html-to-markdown.js"></script>
  <script src="undo-history.js"></script>
  <script src="text-diff.js"></script>
  <script src="find.js"></script>
  <script src="scroll-map.js"></script>
  <script src="zoom-view.js"></script>
  <script src="export-html.js"></script>
  <script src="mermaid-render.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
